<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">The research loop</title><desc id="d">Eight steps from idea to draft pull request; verification failure stops the loop.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<rect width="900" height="330" fill="#fcfcfb"/>
<text x="450.0" y="28.0" font-size="16" fill="#0b0b0b" text-anchor="middle" font-weight="600">One card per wake-up, in this order</text>
<rect x="30.0" y="55.0" width="180.0" height="80.0" rx="6" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="1.5"/>
<text x="120.0" y="90.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">1 Idea</text>
<text x="120.0" y="108.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="400">from the queue</text>
<line x1="210.0" y1="95.0" x2="250.0" y2="95.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="250.0" y="55.0" width="180.0" height="80.0" rx="6" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="1.5"/>
<text x="340.0" y="81.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">2 Design review</text>
<text x="340.0" y="99.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="400">refuters, control,</text>
<text x="340.0" y="117.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="400">cross-check</text>
<line x1="430.0" y1="95.0" x2="470.0" y2="95.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="470.0" y="55.0" width="180.0" height="80.0" rx="6" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="1.5"/>
<text x="560.0" y="81.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">3 Pre-register</text>
<text x="560.0" y="99.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="400">card + experiment</text>
<text x="560.0" y="117.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="400">SHA-256 locked</text>
<line x1="650.0" y1="95.0" x2="690.0" y2="95.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="690.0" y="55.0" width="180.0" height="80.0" rx="6" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="1.5"/>
<text x="780.0" y="81.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">4 Run</text>
<text x="780.0" y="99.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="400">ledger entry,</text>
<text x="780.0" y="117.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="400">hash-chained</text>
<rect x="30.0" y="185.0" width="180.0" height="80.0" rx="6" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="1.5"/>
<text x="120.0" y="211.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">5 Verify</text>
<text x="120.0" y="229.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="400">re-execute, compare</text>
<text x="120.0" y="247.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="400">with cross-check</text>
<line x1="210.0" y1="225.0" x2="250.0" y2="225.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="250.0" y="185.0" width="180.0" height="80.0" rx="6" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="1.5"/>
<text x="340.0" y="211.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">6 Report</text>
<text x="340.0" y="229.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="400">generated from</text>
<text x="340.0" y="247.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="400">recorded data</text>
<line x1="430.0" y1="225.0" x2="470.0" y2="225.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="470.0" y="185.0" width="180.0" height="80.0" rx="6" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="1.5"/>
<text x="560.0" y="211.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">7 Notes + lint</text>
<text x="560.0" y="229.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="400">numbers grounded,</text>
<text x="560.0" y="247.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="400">opinion tagged</text>
<line x1="650.0" y1="225.0" x2="690.0" y2="225.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="690.0" y="185.0" width="180.0" height="80.0" rx="6" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="1.5"/>
<text x="780.0" y="211.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">8 Review + draft PR</text>
<text x="780.0" y="229.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="400">fresh read-only agent,</text>
<text x="780.0" y="247.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="400">maintainer merges</text>
<line x1="780.0" y1="135.0" x2="780.0" y2="160.0" stroke="#52514e" stroke-width="1.5"/>
<line x1="780.0" y1="160.0" x2="120.0" y2="160.0" stroke="#52514e" stroke-width="1.5"/>
<line x1="120.0" y1="160.0" x2="120.0" y2="185.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="250.0" y="285.0" width="400.0" height="34.0" rx="6" fill="#fdeee8" stroke="#eb6834" stroke-width="1.5"/>
<text x="450.0" y="307.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">verify fails: stop, journal, never edit locked files</text>
<line x1="120.0" y1="265.0" x2="120.0" y2="302.0" stroke="#eb6834" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="120.0" y1="302.0" x2="250.0" y2="302.0" stroke="#eb6834" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ar)"/>
</svg>
