<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="900" height="230" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Hash-chained ledger</title><desc id="d">Each ledger entry stores the hash of the previous entry.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<rect width="900" height="230" fill="#fcfcfb"/>
<text x="450.0" y="28.0" font-size="16" fill="#0b0b0b" text-anchor="middle" font-weight="600">Append-only ledger: editing any entry breaks every hash after it</text>
<rect x="30.0" y="55.0" width="190.0" height="120.0" rx="6" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="1.5"/>
<text x="42.0" y="78.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="700">entry 0</text>
<text x="42.0" y="102.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="400">card + experiment hashes</text>
<text x="42.0" y="120.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="400">results hash</text>
<text x="42.0" y="138.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="400">prev = 000…0</text>
<text x="42.0" y="160.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="700">entry hash</text>
<line x1="220.0" y1="115.0" x2="250.0" y2="115.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="250.0" y="55.0" width="190.0" height="120.0" rx="6" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="1.5"/>
<text x="262.0" y="78.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="700">entry 1</text>
<text x="262.0" y="102.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="400">card + experiment hashes</text>
<text x="262.0" y="120.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="400">results hash</text>
<text x="262.0" y="138.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="400">prev = hash of entry 0</text>
<text x="262.0" y="160.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="700">entry hash</text>
<line x1="440.0" y1="115.0" x2="470.0" y2="115.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="470.0" y="55.0" width="190.0" height="120.0" rx="6" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="1.5"/>
<text x="482.0" y="78.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="700">entry 2</text>
<text x="482.0" y="102.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="400">card + experiment hashes</text>
<text x="482.0" y="120.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="400">results hash</text>
<text x="482.0" y="138.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="400">prev = hash of entry 1</text>
<text x="482.0" y="160.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="700">entry hash</text>
<line x1="660.0" y1="115.0" x2="690.0" y2="115.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="690.0" y="55.0" width="190.0" height="120.0" rx="6" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="1.5"/>
<text x="702.0" y="78.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="700">entry 3</text>
<text x="702.0" y="102.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="400">card + experiment hashes</text>
<text x="702.0" y="120.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="400">results hash</text>
<text x="702.0" y="138.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="400">prev = hash of entry 2</text>
<text x="702.0" y="160.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="700">entry hash</text>
<text x="450.0" y="208.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="400">python -m autosci status recomputes the chain; verify also re-executes the run.</text>
</svg>
