name: AQuA pilot

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install optional quantitative dependency
        run: python -m pip install -r research/requirements.txt
      - name: Extension behavior checks
        run: python research/check_pilot.py
      - name: Verify preregistered auction search
        run: python -m autosci verify aqua-search-pilot --strict
