[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "autoscientists"
version = "0.3.0"
description = "Pre-registered, independently verified computational research runs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
autosci = "autosci.cli:main"

[tool.setuptools]
packages = ["autosci"]
